                <div id='collection-component-1768504421958'></div>
                <script type="text/javascript">
                    /*<![CDATA[*/
                    (function () {
                        var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';
                        if (window.ShopifyBuy) {
                            if (window.ShopifyBuy.UI) {
                                ShopifyBuyInit();
                            } else {
                                loadScript();
                            }
                        } else {
                            loadScript();
                        }
                        function loadScript() {
                            var script = document.createElement('script');
                            script.async = true;
                            script.src = scriptURL;
                            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(script);
                            script.onload = ShopifyBuyInit;
                        }
                        function ShopifyBuyInit() {
                            var client = ShopifyBuy.buildClient({
                                domain: '4g5stb-ja.myshopify.com',
                                storefrontAccessToken: '3b9ebf9b58be159f856a3cc6a2c5ac98',
                            });
                            ShopifyBuy.UI.onReady(client).then(function (ui) {
                                ui.createComponent('collection', {
                                    id: '565564244234',
                                    node: document.getElementById('collection-component-1768504421958'),
                                    moneyFormat: '%C2%A3%7B%7Bamount%7D%7D',
                                    options: {
                                        "product": {
                                            "styles": {
                                                "product": {
                                                    "@media (min-width: 601px)": {
                                                        "max-width": "calc(25% - 20px)",
                                                        "margin-left": "20px",
                                                        "margin-bottom": "50px",
                                                        "width": "calc(25% - 20px)"
                                                    },
                                                    "img": {
                                                        "height": "calc(100% - 15px)",
                                                        "position": "absolute",
                                                        "left": "0",
                                                        "right": "0",
                                                        "top": "0"
                                                    },
                                                    "imgWrapper": {
                                                        "padding-top": "calc(75% + 15px)",
                                                        "position": "relative",
                                                        "height": "0"
                                                    }
                                                },
                                                "button": {
                                                    ":hover": {
                                                        "background-color": "#276815"
                                                    },
                                                    "background-color": "#2b7417",
                                                    ":focus": {
                                                        "background-color": "#276815"
                                                    }
                                                }
                                            },
                                            "text": {
                                                "button": "Add to cart"
                                            }
                                        },
                                        "productSet": {
                                            "styles": {
                                                "products": {
                                                    "@media (min-width: 601px)": {
                                                        "margin-left": "-20px"
                                                    }
                                                }
                                            }
                                        },
                                        "modalProduct": {
                                            "contents": {
                                                "img": false,
                                                "imgWithCarousel": true,
                                                "button": false,
                                                "buttonWithQuantity": true
                                            },
                                            "styles": {
                                                "product": {
                                                    "@media (min-width: 601px)": {
                                                        "max-width": "100%",
                                                        "margin-left": "0px",
                                                        "margin-bottom": "0px"
                                                    }
                                                },
                                                "button": {
                                                    ":hover": {
                                                        "background-color": "#276815"
                                                    },
                                                    "background-color": "#2b7417",
                                                    ":focus": {
                                                        "background-color": "#276815"
                                                    }
                                                }
                                            },
                                            "text": {
                                                "button": "Add to cart"
                                            }
                                        },
                                        "option": {},
                                        "cart": {
                                            "styles": {
                                                "button": {
                                                    ":hover": {
                                                        "background-color": "#276815"
                                                    },
                                                    "background-color": "#2b7417",
                                                    ":focus": {
                                                        "background-color": "#276815"
                                                    }
                                                }
                                            },
                                            "text": {
                                                "total": "Subtotal",
                                                "button": "Checkout"
                                            }
                                        },
                                        "toggle": {
                                            "styles": {
                                                "toggle": {
                                                    "background-color": "#2b7417",
                                                    ":hover": {
                                                        "background-color": "#276815"
                                                    },
                                                    ":focus": {
                                                        "background-color": "#276815"
                                                    }
                                                }
                                            }
                                        }
                                    },
                                });
                            });
                        }
                    })();
