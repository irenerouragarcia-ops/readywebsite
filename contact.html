<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Comfortaa:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="lang-en page-sub page-bg-forest bg-pos-bottom">
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="logo_main.png" alt="Irene Roura García">
        </a>
        <div class="nav-actions">
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="en">EN</button>
                <span class="divider">|</span>
                <button class="lang-btn" data-lang="es">ES</button>
            </div>
        </div>
        <div class="menu-toggle" id="menuToggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <ul class="nav-links">
            <li><a href="about.html" data-i18n="nav.about">About</a></li>
            <li><a href="sessions.html" data-i18n="nav.sessions">Sessions</a></li>
            <li><a href="resources.html" data-i18n="nav.resources">Resources</a></li>
            <li><a href="shop.html" data-i18n="nav.shop">Shop</a></li>
            <li><a href="contact.html" class="active" data-i18n="nav.contact">Contact</a></li>
        </ul>
    </nav>

    <main class="organic-container top-pad">
        <section class="organic-section center-align">

            <div class="content-glass wide">
                <h1 data-i18n="contact.title">Contact</h1>

                <div class="contact-grid">
                    <!-- Email Card -->
                    <div class="contact-card">
                        <div class="card-icon-frame"></div>
                        <h3><i data-lucide="mail"></i> Email</h3>
                        <p>irenerouragarcia@gmail.com</p>
                        <a href="mailto:irenerouragarcia@gmail.com" class="btn-primary"
                            data-i18n="contact.email_btn">Send Email</a>
                    </div>

                    <!-- Instagram Card -->
                    <a href="https://instagram.com/irenerouragarcia" target="_blank" class="contact-card">
                        <div class="card-icon-frame"></div>
                        <h3><i data-lucide="instagram"></i> <span data-i18n="contact.insta_title">Instagram</span></h3>
                        <p data-i18n="contact.insta_text">Daily insights and content.</p>
                        <div class="btn-primary">
                            <span data-i18n="contact.insta_btn">Follow</span> <i data-lucide="external-link"></i>
                        </div>
                    </a>

                    <!-- Newsletter Card -->
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdQqC-g87gOfOLopDv-YPVZDtfQHhD2Iso0UI1QvNwn-w5B5A/viewform?usp=sharing&ouid=106063953887250430831"
                        target="_blank" class="contact-card">
                        <div class="card-icon-frame"></div>
                        <h3><i data-lucide="newspaper"></i> <span data-i18n="contact.news_title">Newsletter</span></h3>
                        <p data-i18n="contact.news_text">Stay updated with latest news and resources.</p>
                        <div class="btn-primary">
                            <span data-i18n="contact.news_btn">Subscribe</span> <i data-lucide="external-link"></i>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <!-- Visual break removed -->
    </main>

    <footer>

        <p>&copy; 2026 Irene Roura García. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </footer>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
